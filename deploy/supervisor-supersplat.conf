# Serves the locally built SuperSplat editor (mounted read-only from the host)
# inside the container. Bound to 127.0.0.1 on purpose: with network_mode=host
# this loopback is the host's, reachable by the in-container browser at
# http://localhost:8082 but not exposed to the LAN.
[program:supersplat]
command=python3 -m http.server 8082 --bind 127.0.0.1 --directory /home/ubuntu/supersplat/dist
autorestart=true
startretries=10
stdout_logfile=/tmp/supersplat.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
