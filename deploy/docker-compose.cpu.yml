services:
  selkies:
    image: ${SELKIES_IMAGE}
    container_name: selkies-supersplat
    restart: unless-stopped
    network_mode: host
    shm_size: "2gb"
    stdin_open: true
    tty: true
    environment:
      SELKIES_ENABLE_BASIC_AUTH: "true"
      SELKIES_BASIC_AUTH_USER: ${SELKIES_BASIC_AUTH_USER}
      SELKIES_BASIC_AUTH_PASSWORD: ${SELKIES_BASIC_AUTH_PASSWORD}
      SELKIES_ENABLE_RESIZE: "true"
      # CPU host: x264enc is the only valid encoder here; never nv*/va*
      SELKIES_ENCODER: x264enc
      SELKIES_FRAMERATE: ${SELKIES_FRAMERATE}
      SELKIES_VIDEO_BITRATE: ${SELKIES_VIDEO_BITRATE}
      START_XFCE4: "true"
      SELKIES_TURN_HOST: ${SELKIES_TURN_HOST}
      SELKIES_TURN_PORT: ${SELKIES_TURN_PORT}
      SELKIES_TURN_PROTOCOL: ${SELKIES_TURN_PROTOCOL}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
      TURN_EXTRA_ARGS: ${TURN_EXTRA_ARGS}
    volumes:
      - ${SUPERSPLAT_DIST_DIR}:/home/ubuntu/supersplat:ro
      - ${SELKIES_DATA_DIR}:/home/ubuntu/Documents
      # Bulk splat data (checkpoints, captures): read-only in the desktop
      - ${DATASETS_DIR}:/home/ubuntu/datasets:ro
      # Extra supervisord program: serves supersplat/dist on 127.0.0.1:8082
      - ./supervisor-supersplat.conf:/etc/supervisor/conf.d/supersplat.conf:ro
