services:
  selkies:
    image: ${SELKIES_IMAGE}
    container_name: selkies-supersplat
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    shm_size: "2gb"
    stdin_open: true
    tty: true
    environment:
      NVIDIA_VISIBLE_DEVICES: ${SELKIES_GPU_INDEX}
      NVIDIA_DRIVER_CAPABILITIES: all
      SELKIES_ENABLE_BASIC_AUTH: "true"
      SELKIES_BASIC_AUTH_USER: ${SELKIES_BASIC_AUTH_USER}
      SELKIES_BASIC_AUTH_PASSWORD: ${SELKIES_BASIC_AUTH_PASSWORD}
      SELKIES_ENABLE_RESIZE: "true"
      SELKIES_ENCODER: ${SELKIES_ENCODER}
      START_XFCE4: "true"
      SELKIES_TURN_HOST: ${SELKIES_TURN_HOST}
      SELKIES_TURN_PORT: ${SELKIES_TURN_PORT}
      SELKIES_TURN_PROTOCOL: ${SELKIES_TURN_PROTOCOL}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
      TURN_EXTRA_ARGS: ${TURN_EXTRA_ARGS}
    volumes:
      - /home/jing.feng/codebases/supersplat:/home/ubuntu/supersplat:ro
      - /home/jing.feng/selkies-data:/home/ubuntu/Documents
      # Extra supervisord program: serves supersplat/dist on 127.0.0.1:8082
      - ./supervisor-supersplat.conf:/etc/supervisor/conf.d/supersplat.conf:ro
      # Host mount-point dir: rslave so a share mounted there on the host
      # after container start becomes visible inside without a recreate
      - type: bind
        source: /home/jing.feng/mounts/selkies-mount-data
        target: /home/ubuntu/mount-data
        bind:
          propagation: rslave
          create_host_path: true
